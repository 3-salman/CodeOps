      border-radius: 8px;

</head>
<body>
  <div class="card-container">
    <div class="card"><h3>Card 1</h3><p>Content area...</p></div>
    <div class="card"><h3>Card 2</h3><p>Content area...</p></div>
    <div class="card"><h3>Card 3</h3><p>Content area...</p></div>
    <div class="card"><h3>Card 4</h3><p>Content area...</p></div>
  </div>
</body>
</html>
