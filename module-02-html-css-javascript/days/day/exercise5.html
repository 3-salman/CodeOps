<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .product-card {
      
      position: relative;
      width: 260px;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin: 2rem;
    }

    .sale-badge {
      
      position: absolute;
      top: -10px;
      right: -10px;
      
      
      width: 55px;
      height: 55px;
      border-radius: 50%;
      
      
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      
      background-color: #ef4444;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="product-card">
    
    <div class="sale-badge">ETB<br>Sale</div>
    
   
    <h3>Leather Shoes</h3>
    <p>Premium handcrafted footwear.</p>
    <p><strong>2,500 ETB</strong></p>
  </div>
</body>
</html>
