<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
   
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    
    .navbar {
      display: flex;
      
      justify-content: space-between;
      
      align-items: center;
      padding: 1rem 2rem;
      background-color: #1a1a1a;
      color: white;
    }

    
    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem; 
    }

    .nav-right a {
      color: white;
      text-decoration: none;
    }

    .nav-btn {
      padding: 0.5rem 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    
    <div class="logo"><strong>MyBrand</strong></div>
    
    
    <div class="nav-right">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <button class="nav-btn">Contact</button>
    </div>
  </nav>
</body>
</html>
